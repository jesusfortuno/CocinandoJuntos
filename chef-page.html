<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Chef | Cocinando Juntos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="./include-components.js" data-include="nav,footer"></script>
    <style>
        :root {
            --primary-color: #6b4423;
            --primary-light: rgba(107, 68, 35, 0.1);
            --secondary-color: #f8f5f2;
            --text-color: #333;
            --text-light: #666;
            --border-color: #e0e0e0;
            --success-color: #4caf50;
            --warning-color: #ff9800;
            --danger-color: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: var(--text-color);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-header h1 {
            color: var(--primary-color);
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        .page-header p {
            color: var(--text-light);
            font-size: 1.1rem;
            margin: 0;
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 1.5rem;
            color: white;
        }

        .recipes-icon {
            background-color: #4caf50;
        }

        .comments-icon {
            background-color: #2196f3;
        }

        .favorites-icon {
            background-color: #e91e63;
        }

        .stat-info h3 {
            margin: 0;
            font-size: 1rem;
            color: var(--text-light);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 0.25rem 0;
        }

        .section-title {
            color: var(--primary-color);
            font-size: 1.5rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--secondary-color);
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .action-button {
            background: white;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--text-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
        }

        .action-button:hover {
            transform: translateY(-5px);
        }

        .action-button i {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .action-button span {
            font-weight: 600;
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 15px;
            }
            
            .stats-cards, .action-buttons {
                grid-template-columns: 1fr;
            }
            
            .stat-card {
                padding: 15px;
            }
            
            .stat-icon {
                width: 50px;
                height: 50px;
                font-size: 1.25rem;
            }
            
            .stat-value {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <!-- Placeholder para la navegación -->
    <div id="nav-placeholder"></div>

    <!-- Espacio de separación -->
    <div style="height: 20px;"></div>

    <div class="container">
        <div class="page-header">
            <h1>Panel de Chef</h1>
            <p>Bienvenido de nuevo, <span id="welcome-name">Chef</span></p>
        </div>

        <div class="stats-cards">
            <div class="stat-card">
                <div class="stat-icon recipes-icon">
                    <i class="fas fa-book-open"></i>
                </div>
                <div class="stat-info">
                    <h3>Mis Recetas</h3>
                    <p id="total-recetas" class="stat-value">0</p>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon comments-icon">
                    <i class="fas fa-comments"></i>
                </div>
                <div class="stat-info">
                    <h3>Comentarios</h3>
                    <p id="total-comentarios" class="stat-value">0</p>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon favorites-icon">
                    <i class="fas fa-heart"></i>
                </div>
                <div class="stat-info">
                    <h3>Favoritos</h3>
                    <p id="total-favoritos" class="stat-value">0</p>
                </div>
            </div>
        </div>

        <h2 class="section-title">Acciones Rápidas</h2>
        <div class="action-buttons">
            <a href="chef-add-recipe.html" class="action-button" id="quick-add-recipe">
                <i class="fas fa-plus-circle"></i>
                <span>Añadir Receta</span>
            </a>
            <a href="chef-comments.html" class="action-button" id="quick-view-comments">
                <i class="fas fa-comments"></i>
                <span>Ver Comentarios</span>
            </a>
            <a href="chef-favorites.html" class="action-button" id="quick-view-favorites">
                <i class="fas fa-heart"></i>
                <span>Ver Favoritos</span>
            </a>
        </div>
    </div>

    <!-- Placeholder para el footer -->
    <div id="footer-placeholder"></div>

    <script>
        // Configuración de Supabase
        const SUPABASE_URL = "https://uonkcjrokwtgvimjxawm.supabase.co";
        const SUPABASE_API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVvbmtjanJva3d0Z3ZpbWp4YXdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzg2ODIyNTgsImV4cCI6MjA1NDI1ODI1OH0.fTH7cyyYYQFi5HQc8y-JXAKSY0PL3P1FKy6LymfeTvU";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_API_KEY);

        document.addEventListener("DOMContentLoaded", async function() {
            const usuario = JSON.parse(localStorage.getItem("usuario"));

            // Si no hay usuario o el usuario no tiene rol chef, redirigir
            if (!usuario || usuario.rol !== "chef") {
                console.log("Acceso no autorizado a la página de chef");
                alert("No tienes permisos para acceder a esta página");
                window.location.href = "US1_PantallaInicio/index.html";
                return;
            }

            // Mostrar información del usuario
            document.getElementById("welcome-name").textContent = usuario.username;

            // Cargar estadísticas
            await cargarEstadisticas(usuario);

            // Configurar enlaces de acciones rápidas
            document.getElementById('quick-add-recipe').addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'chef-add-recipe.html';
            });

            document.getElementById('quick-view-comments').addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'chef-comments.html';
            });

            document.getElementById('quick-view-favorites').addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'chef-favorites.html';
            });
        });

        // Función para cargar estadísticas desde Supabase
        async function cargarEstadisticas(usuario) {
            try {
                // Obtener el ID del usuario
                const { data: userData, error: userError } = await supabase
                    .from("usuarios")
                    .select("id")
                    .eq("username", usuario.username)
                    .single();

                if (userError) {
                    console.error("Error al obtener datos del usuario:", userError);
                    return;
                }

                const userId = userData.id;

                // Obtener conteo de recetas
                const { count: recetasCount, error: recetasError } = await supabase
                    .from("recetas")
                    .select("id", { count: "exact", head: true })
                    .eq("usuario_id", userId);

                if (!recetasError) {
                    document.getElementById("total-recetas").textContent = recetasCount || 0;
                }

                // Obtener IDs de las recetas del chef
                const { data: recetasData, error: recetasDataError } = await supabase
                    .from("recetas")
                    .select("id")
                    .eq("usuario_id", userId);

                if (!recetasDataError && recetasData.length > 0) {
                    const recetasIds = recetasData.map(receta => receta.id);

                    // Obtener conteo de comentarios
                    const { count: comentariosCount, error: comentariosError } = await supabase
                        .from("comentarios")
                        .select("id_comentario", { count: "exact", head: true })
                        .in("id_receta", recetasIds);

                    if (!comentariosError) {
                        document.getElementById("total-comentarios").textContent = comentariosCount || 0;
                    }

                    // Obtener conteo de favoritos
                    const { count: favoritosCount, error: favoritosError } = await supabase
                        .from("favoritos")
                        .select("id", { count: "exact", head: true })
                        .in("receta_id", recetasIds);

                    if (!favoritosError) {
                        document.getElementById("total-favoritos").textContent = favoritosCount || 0;
                    }
                } else {
                    // Si no hay recetas, establecer comentarios y favoritos a 0
                    document.getElementById("total-comentarios").textContent = 0;
                    document.getElementById("total-favoritos").textContent = 0;
                }
            } catch (error) {
                console.error("Error al cargar estadísticas:", error);
            }
        }
    </script>
</body>

</html>
