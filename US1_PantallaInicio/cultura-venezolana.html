        /* Estilos para asegurar que las recetas se muestren en una cuadrícula de 4 columnas */
        .recipes-grid {
            display: grid !important;
            grid-template-columns: repeat(4, 1fr) !important;
            gap: 20px !important;
            margin-top: 2rem !important;
            width: 100% !important;
            max-width: 1200px !important;
            margin-left: auto !important;
            margin-right: auto !important;
        }
        
        .recipe-card {
            width: 100% !important;
            margin: 0 !important;
            border-radius: 8px !important;
            overflow: hidden !important;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1) !important;
            transition: transform 0.3s ease !important;
            background: white !important;
            display: flex !important;
            flex-direction: column !important;
        }
        
        .recipe-card:hover {
            transform: translateY(-5px) !important;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1) !important;
        }
        
        .recipe-image {
            width: 100% !important;
            height: 200px !important;
            overflow: hidden !important;
        }
        
        .recipe-image img {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            transition: transform 0.3s ease !important;
        }
        
        .recipe-card:hover .recipe-image img {
            transform: scale(1.05) !important;
        }
        
        .recipe-card h3 {
            padding: 1rem !important;
            margin: 0 !important;
            font-size: 1.1rem !important;
            color: #333 !important;
        }
        
        .recipe-meta {
            display: flex !important;
            padding: 0 1rem 1rem !important;
            gap: 0.5rem !important;
            flex-wrap: wrap !important;
        }
        
        .difficulty, .time, .category {
            background: #f8f1e9 !important;
            padding: 0.3rem 0.6rem !important;
            border-radius: 4px !important;
            font-size: 0.8rem !important;
            color: #6b4423 !important;
        }
        
        /* Estilos responsivos */
        @media screen and (max-width: 1200px) {
            .recipes-grid {
                grid-template-columns: repeat(3, 1fr) !important;
            }
        }
        
        @media screen and (max-width: 992px) {
            .recipes-grid {
                grid-template-columns: repeat(2, 1fr) !important;
            }
        }
        
        @media screen and (max-width: 576px) {
            .recipes-grid {
                grid-template-columns: 1fr !important;
            }
        }

// Function to translate the page
function translatePage(language) {
  document.querySelectorAll('[data-i18n]').forEach(element => {
    const key = element.getAttribute('data-i18n');
    if (translations[language] && translations[language][key]) {
      if (element.hasAttribute('placeholder')) {
        element.setAttribute('placeholder', translations[language][key]);
      } else {
        element.textContent = translations[language][key];
      }
    }
  });
  
  // Update the language selector
  const languageSelector = document.getElementById('language');
  if (languageSelector) {
    languageSelector.value = language;
  }
  
  // Update footer text (which might not have data-i18n attributes)
  const footerDescription = document.querySelector('.footer-description');
  if (footerDescription && translations[language]["Cocinando Juntos es una comunidad de amantes de la gastronomía donde podrás explorar sabores de diferentes culturas, compartir tus recetas favoritas y aprender nuevas técnicas culinarias."]) {
    footerDescription.textContent = translations[language]["Cocinando Juntos es una comunidad de amantes de la gastronomía donde podrás explorar sabores de diferentes culturas, compartir tus recetas favoritas y aprender nuevas técnicas culinarias."];
  }
}

// Function to change language
function changeLanguage(lang) {
  localStorage.setItem('language', lang);
  translatePage(lang);
}

// Initialize translation
document.addEventListener('DOMContentLoaded', function() {
  const savedLanguage = localStorage.getItem('language') || 'es';
  translatePage(savedLanguage);
  
  // Set up language selector
  const languageSelector = document.getElementById('language');
  if (languageSelector) {
    languageSelector.value = savedLanguage;
    languageSelector.addEventListener('change', function() {
      changeLanguage(this.value);
    });
  }
});

// Make functions available globally
window.changeLanguage = changeLanguage;
window.translatePage = translatePage;

// Script para los filtros
document.addEventListener("DOMContentLoaded", () => {
    const filterBtn = document.getElementById("filter-btn");
    const filterOptions = document.getElementById("filter-options");
    const applyFiltersBtn = document.getElementById("apply-filters");

    filterBtn.addEventListener("click", () => {
        filterOptions.style.display = filterOptions.style.display === "none" ? "block" : "none";
    });

    applyFiltersBtn.addEventListener("click", () => {
        const selectedCulture = document.getElementById("filter-culture").value;
        const selectedDifficulty = document.getElementById("filter-difficulty").value;
        const selectedTime = document.getElementById("filter-time").value;

        const recipes = document.querySelectorAll(".recipe-card");

        recipes.forEach(recipe => {
            const recipeCulture = recipe.getAttribute("data-culture");
            const recipeTime = parseInt(recipe.getAttribute("data-time"));
            const recipeDifficulty = recipe.getAttribute("data-difficulty");

            const matchesCulture = !selectedCulture || selectedCulture === recipeCulture;
            const matchesDifficulty = !selectedDifficulty || selectedDifficulty === recipeDifficulty;
            let matchesTime = false;

            if (selectedTime === "" ||
                (selectedTime === "0-30" && recipeTime <= 30) ||
                (selectedTime === "30-60" && recipeTime > 30 && recipeTime <= 60) ||
                (selectedTime === "60-120" && recipeTime > 60 && recipeTime <= 120) ||
                (selectedTime === "121" && recipeTime > 120)) {
                matchesTime = true;
            }

            if (matchesCulture && matchesDifficulty && matchesTime) {
                recipe.style.display = "block";
            } else {
                recipe.style.display = "none";
            }
        });

        filterOptions.style.display = "none";
    });

    document.addEventListener("click", (event) => {
        if (!filterOptions.contains(event.target) && event.target !== filterBtn) {
            filterOptions.style.display = "none";
        }
    });
});
