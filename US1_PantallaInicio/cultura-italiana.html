<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultura Italiana - Cocinando Juntos</title>
    <link rel="stylesheet" href="styles2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body style="margin: 0; min-height: 100vh; display: flex; flex-direction: column;">
    <!-- Placeholder para la navegación -->
    <div id="nav-placeholder"></div>

    <main>
        <!-- Breadcrumb -->
        <div class="breadcrumb">
            <a href="index.html">Inicio</a> >
            <span>Cultura Italiana</span>
        </div>

        <!-- Título de la cultura -->
        <div class="culture-header">
            <h1>Cultura Italiana</h1>
            <div class="culture-description">
                <p>Descubre los sabores auténticos de la cocina tradicional italiana</p>
            </div>
        </div>

        <!-- Filtros -->
        <div class="filters">
            <div class="filter-group">
                <button class="filter-button active" onclick="window.location.href='../Platos.html'">Mejor
                    Valoradas</button>
            </div>
            <div class="filter-group">
                <button class="filter-button" id="filter-btn">Filtros</button>
            </div>
        </div>

        <!-- Cuadro emergente de filtros -->
        <div id="filter-options" style="display: none;">
            <label for="filter-culture">Cultura:</label>
            <select id="filter-culture">
                <option value="">Todas</option>
                <option value="Italiana">Italiana</option>
                <option value="Española">Española</option>
                <option value="Francesa">Francesa</option>
                <option value="China">China</option>
                <option value="Japonesa">Japonesa</option>
                <option value="Venezolana">Venezolana</option>
            </select>

            <label for="filter-difficulty">Dificultad:</label>
            <select id="filter-difficulty">
                <option value="">Todas</option>
                <option value="Fácil">Fácil</option>
                <option value="Media">Media</option>
                <option value="Difícil">Difícil</option>
            </select>

            <label for="filter-time">Tiempo:</label>
            <select id="filter-time">
                <option value="">Cualquier tiempo</option>
                <option value="0-30">Menos de 30 min</option>
                <option value="30-60">30 - 60 min</option>
                <option value="60-120">60 - 120 min</option>
                <option value="121">Más de 120 min</option>
            </select>

            <button id="apply-filters">Aplicar Filtros</button>
        </div>

        <!-- Grid de recetas -->
        <div class="recipes-grid">
            <div class="recipe-card" data-culture="Italiana" data-time="120" data-difficulty="Media">
                <div class="recipe-image">
                    <a href="./../US6_GuardarRecetas/bizcocho-capuccino.html"><img
                            src="./Imagenes/Italia/bizcocho-capuccino.jpg" alt="Bizcocho de Capuccino"></a>
                </div>
                <h3>Bizcocho de Capuccino</h3>
                <div class="recipe-meta">
                    <span class="difficulty">Media</span>
                    <span class="time">1h 30 min</span>
                    <span class="category">Desayuno</span>
                </div>
            </div>

            <div class="recipe-card" data-culture="Italiana" data-time="40" data-difficulty="Media">
                <div class="recipe-image">
                    <a href="./../US6_GuardarRecetas/cannoli.html"><img
                            src="./Imagenes/Italia/cannoli.png" alt="Cannoli"></a>
                </div>
                <h3>Cannoli</h3>
                <div class="recipe-meta">
                    <span class="difficulty">Media</span>
                    <span class="time">40 min</span>
                    <span class="category">Merienda</span>
                </div>
            </div>

            <div class="recipe-card" data-culture="Italiana" data-time="105" data-difficulty="Media">
                <div class="recipe-image">
                    <a href="./../US6_GuardarRecetas/lasana.html"><img
                            src="./Imagenes/Italia/lasaña.jpg" alt="Lasaña"></a>
                </div>
                <h3>Lasaña</h3>
                <div class="recipe-meta">
                    <span class="difficulty">Media</span>
                    <span class="time">1h 45 min</span>
                    <span class="category">Comida</span>
                </div>
            </div>

            <div class="recipe-card" data-culture="Italiana" data-time="55" data-difficulty="Fácil">
                <div class="recipe-image">
                    <a href="./../US6_GuardarRecetas/pizza-margarita.html"><img
                            src="./Imagenes/Italia/pizza-margarita.jpg" alt="Pizza Margarita"></a>
                </div>
                <h3>Pizza Margarita</h3>
                <div class="recipe-meta">
                    <span class="difficulty">Fácil</span>
                    <span class="time">55 min</span>
                    <span class="category">Cena</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Placeholder para el footer -->
    <div id="footer-placeholder"></div>

    <script src="index.js" defer></script>
    <script src="include-components.js" defer></script>
</body>

</html>
