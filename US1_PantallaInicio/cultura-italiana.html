<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultura Italiana - Cocinando Juntos</title>
    <link rel="stylesheet" href="styles2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="../include-components.js" data-include="nav,footer"></script>
    <style>
        /* Estilos para asegurar que las recetas se muestren en una cuadrícula de 4 columnas */
        .recipes-grid {
            display: grid !important;
            grid-template-columns: repeat(4, 1fr) !important;
            gap: 20px !important;
            margin-top: 2rem !important;
            width: 100% !important;
            max-width: 1200px !important;
            margin-left: auto !important;
            margin-right: auto !important;
        }
        
        .recipe-card {
            width: 100% !important;
            margin: 0 !important;
            border-radius: 8px !important;
            overflow: hidden !important;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1) !important;
            transition: transform 0.3s ease !important;
            background: white !important;
            display: flex !important;
            flex-direction: column !important;
        }
        
        .recipe-card:hover {
            transform: translateY(-5px) !important;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1) !important;
        }
        
        .recipe-image {
            width: 100% !important;
            height: 200px !important;
            overflow: hidden !important;
        }
        
        .recipe-image img {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            transition: transform 0.3s ease !important;
        }
        
        .recipe-card:hover .recipe-image img {
            transform: scale(1.05) !important;
        }
        
        .recipe-card h3 {
            padding: 1rem !important;
            margin: 0 !important;
            font-size: 1.1rem !important;
            color: #333 !important;
        }
        
        .recipe-meta {
            display: flex !important;
            padding: 0 1rem 1rem !important;
            gap: 0.5rem !important;
            flex-wrap: wrap !important;
        }
        
        .difficulty, .time, .category {
            background: #f8f1e9 !important;
            padding: 0.3rem 0.6rem !important;
            border-radius: 4px !important;
            font-size: 0.8rem !important;
            color: #6b4423 !important;
        }
        
        /* Estilos responsivos */
        @media screen and (max-width: 1200px) {
            .recipes-grid {
                grid-template-columns: repeat(3, 1fr) !important;
            }
        }
        
        @media screen and (max-width: 992px) {
            .recipes-grid {
                grid-template-columns: repeat(2, 1fr) !important;
            }
        }
        
        @media screen and (max-width: 576px) {
            .recipes-grid {
                grid-template-columns: 1fr !important;
            }
        }
    </style>
</head>

<body style="margin: 0; min-height: 100vh; display: flex; flex-direction: column;">
    <!-- Placeholder para la navegación -->
    <div id="nav-placeholder"></div>

    <main>
        <!-- Breadcrumb -->
        <div class="breadcrumb">
            <a href="index.html" data-i18n="Inicio">Inicio</a> >
            <span data-i18n="Cultura Italiana">Cultura Italiana</span>
        </div>

        <!-- Título de la cultura -->
        <div class="culture-header">
            <h1 data-i18n="Cultura Italiana">Cultura Italiana</h1>
            <div class="culture-description">
                <p data-i18n="Descubre los sabores auténticos de la cocina tradicional italiana">Descubre los sabores auténticos de la cocina tradicional italiana</p>
            </div>
        </div>

        <!-- Filtros -->
        <div class="filters">
            <div class="filter-group">
                <button class="filter-button active" onclick="window.location.href='../Platos.html'" data-i18n="Mejor Valoradas">Mejor
                    Valoradas</button>
            </div>
            <div class="filter-group">
                <button class="filter-button" id="filter-btn" data-i18n="Filtros">Filtros</button>
            </div>
        </div>

        <!-- Cuadro emergente de filtros -->
        <div id="filter-options" style="display: none;">
            <label for="filter-culture" data-i18n="Cultura:">Cultura:</label>
            <select id="filter-culture">
                <option value="" data-i18n="Todas">Todas</option>
                <option value="Italiana" data-i18n="Italiana">Italiana</option>
                <option value="Española" data-i18n="Española">Española</option>
                <option value="Francesa" data-i18n="Francesa">Francesa</option>
                <option value="China" data-i18n="China">China</option>
                <option value="Japonesa" data-i18n="Japonesa">Japonesa</option>
                <option value="Venezolana" data-i18n="Venezolana">Venezolana</option>
            </select>

            <label for="filter-difficulty" data-i18n="Dificultad:">Dificultad:</label>
            <select id="filter-difficulty">
                <option value="" data-i18n="Todas">Todas</option>
                <option value="Fácil" data-i18n="Fácil">Fácil</option>
                <option value="Media" data-i18n="Media">Media</option>
                <option value="Difícil" data-i18n="Difícil">Difícil</option>
            </select>

            <label for="filter-time" data-i18n="Tiempo:">Tiempo:</label>
            <select id="filter-time">
                <option value="" data-i18n="Cualquier tiempo">Cualquier tiempo</option>
                <option value="0-30" data-i18n="Menos de 30 min">Menos de 30 min</option>
                <option value="30-60" data-i18n="30 - 60 min">30 - 60 min</option>
                <option value="60-120" data-i18n="60 - 120 min">60 - 120 min</option>
                <option value="121" data-i18n="Más de 120 min">Más de 120 min</option>
            </select>

            <button id="apply-filters" data-i18n="Aplicar Filtros">Aplicar Filtros</button>
        </div>

        <!-- Grid de recetas -->
        <div class="recipes-grid">
            <div class="recipe-card" data-culture="Italiana" data-time="120" data-difficulty="Media">
                <div class="recipe-image">
                    <a href="./../US6_GuardarRecetas/bizcocho-capuccino.html"><img
                            src="../Imagenes/Italia/bizcocho-capuccino.jpg" alt="Bizcocho de Capuccino"></a>
                </div>
                <h3 data-i18n="Bizcocho de Capuccino">Bizcocho de Capuccino</h3>
                <div class="recipe-meta">
                    <span class="difficulty" data-i18n="Media">Media</span>
                    <span class="time" data-i18n="1h 30 min">1h 30 min</span>
                    <span class="category" data-i18n="Desayuno">Desayuno</span>
                </div>
            </div>

            <div class="recipe-card" data-culture="Italiana" data-time="40" data-difficulty="Media">
                <div class="recipe-image">
                    <a href="./../US6_GuardarRecetas/cannoli.html"><img
                            src="../Imagenes/Italia/cannoli.png" alt="Cannoli"></a>
                </div>
                <h3 data-i18n="Cannoli">Cannoli</h3>
                <div class="recipe-meta">
                    <span class="difficulty" data-i18n="Media">Media</span>
                    <span class="time" data-i18n="40 min">40 min</span>
                    <span class="category" data-i18n="Merienda">Merienda</span>
                </div>
            </div>

            <div class="recipe-card" data-culture="Italiana" data-time="105" data-difficulty="Media">
                <div class="recipe-image">
                    <a href="./../US6_GuardarRecetas/lasana.html"><img
                            src="../Imagenes/Italia/lasaña.jpg" alt="Lasaña"></a>
                </div>
                <h3 data-i18n="Lasaña">Lasaña</h3>
                <div class="recipe-meta">
                    <span class="difficulty" data-i18n="Media">Media</span>
                    <span class="time" data-i18n="1h 45 min">1h 45 min</span>
                    <span class="category" data-i18n="Comida">Comida</span>
                </div>
            </div>

            <div class="recipe-card" data-culture="Italiana" data-time="55" data-difficulty="Fácil">
                <div class="recipe-image">
                    <a href="./../US6_GuardarRecetas/pizza-margarita.html"><img
                            src="../Imagenes/Italia/pizza-margarita.jpg" alt="Pizza Margarita"></a>
                </div>
                <h3 data-i18n="Pizza Margarita">Pizza Margarita</h3>
                <div class="recipe-meta">
                    <span class="difficulty" data-i18n="Fácil">Fácil</span>
                    <span class="time" data-i18n="55 min">55 min</span>
                    <span class="category" data-i18n="Cena">Cena</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Placeholder para el footer -->
    <div id="footer-placeholder"></div>

    <script src="index.js" defer></script>
    <script src="include-components.js" defer></script>
    <!-- Cargar primero el archivo de traducciones -->
    <script src="../translations.js"></script>
    <!-- Luego cargar el script de cambio de idioma -->
    <script src="language-switcher.js"></script>
    <!-- Opcionalmente, cargar el helper de traducciones -->
    <script src="../translation-helper.js"></script>
    <!-- Finalmente, cargar el script para arreglar los enlaces -->
    <script src="../fix-links.js"></script>
    <script>
        // Script para los filtros
        document.addEventListener("DOMContentLoaded", () => {
            const filterBtn = document.getElementById("filter-btn");
            const filterOptions = document.getElementById("filter-options");
            const applyFiltersBtn = document.getElementById("apply-filters");

            filterBtn.addEventListener("click", () => {
                filterOptions.style.display = filterOptions.style.display === "none" ? "block" : "none";
            });

            applyFiltersBtn.addEventListener("click", () => {
                const selectedCulture = document.getElementById("filter-culture").value;
                const selectedDifficulty = document.getElementById("filter-difficulty").value;
                const selectedTime = document.getElementById("filter-time").value;

                const recipes = document.querySelectorAll(".recipe-card");

                recipes.forEach(recipe => {
                    const recipeCulture = recipe.getAttribute("data-culture");
                    const recipeTime = parseInt(recipe.getAttribute("data-time"));
                    const recipeDifficulty = recipe.getAttribute("data-difficulty");

                    const matchesCulture = !selectedCulture || selectedCulture === recipeCulture;
                    const matchesDifficulty = !selectedDifficulty || selectedDifficulty === recipeDifficulty;
                    let matchesTime = false;

                    if (selectedTime === "" ||
                        (selectedTime === "0-30" && recipeTime <= 30) ||
                        (selectedTime === "30-60" && recipeTime > 30 && recipeTime <= 60) ||
                        (selectedTime === "60-120" && recipeTime > 60 && recipeTime <= 120) ||
                        (selectedTime === "121" && recipeTime > 120)) {
                        matchesTime = true;
                    }

                    if (matchesCulture && matchesDifficulty && matchesTime) {
                        recipe.style.display = "block";
                    } else {
                        recipe.style.display = "none";
                    }
                });

                filterOptions.style.display = "none";
            });

            document.addEventListener("click", (event) => {
                if (!filterOptions.contains(event.target) && event.target !== filterBtn) {
                    filterOptions.style.display = "none";
                }
            });
        });
    </script>
</body>

</html>
