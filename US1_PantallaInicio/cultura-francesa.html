<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultura Francesa - Cocinando Juntos</title>
    <link rel="stylesheet" href="styles2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="../include-components.js" data-include="nav,footer"></script>
    <style>
        /* Estilos para asegurar que las recetas se muestren en una cuadrícula de 4 columnas */
        .recipes-grid {
            display: grid !important;
            grid-template-columns: repeat(4, 1fr) !important;
            gap: 20px !important;
            margin-top: 2rem !important;
            width: 100% !important;
            max-width: 1200px !important;
            margin-left: auto !important;
            margin-right: auto !important;
        }
        
        .recipe-card {
            width: 100% !important;
            margin: 0 !important;
            border-radius: 8px !important;
            overflow: hidden !important;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1) !important;
            transition: transform 0.3s ease !important;
            background: white !important;
            display: flex !important;
            flex-direction: column !important;
        }
        
        .recipe-card:hover {
            transform: translateY(-5px) !important;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1) !important;
        }
        
        .recipe-image {
            width: 100% !important;
            height: 200px !important;
            overflow: hidden !important;
        }
        
        .recipe-image img {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            transition: transform 0.3s ease !important;
        }
        
        .recipe-card:hover .recipe-image img {
            transform: scale(1.05) !important;
        }
        
        .recipe-card h3 {
            padding: 1rem !important;
            margin: 0 !important;
            font-size: 1.1rem !important;
            color: #333 !important;
        }
        
        .recipe-meta {
            display: flex !important;
            padding: 0 1rem 1rem !important;
            gap: 0.5rem !important;
            flex-wrap: wrap !important;
        }
        
        .difficulty, .time, .category {
            background: #f8f1e9 !important;
            padding: 0.3rem 0.6rem !important;
            border-radius: 4px !important;
            font-size: 0.8rem !important;
            color: #6b4423 !important;
        }
        
        /* Estilos responsivos */
        @media screen and (max-width: 1200px) {
            .recipes-grid {
                grid-template-columns: repeat(3, 1fr) !important;
            }
        }
        
        @media screen and (max-width: 992px) {
            .recipes-grid {
                grid-template-columns: repeat(2, 1fr) !important;
            }
        }
        
        @media screen and (max-width: 576px) {
            .recipes-grid {
                grid-template-columns: 1fr !important;
            }
        }
    </style>
</head>

<body style="margin: 0; min-height: 100vh; display: flex; flex-direction: column;">
    <!-- Placeholder para la navegación -->
    <div id="nav-placeholder"></div>

    <main>
        <!-- Breadcrumb -->
        <div class="breadcrumb">
            <a href="index.html">Inicio</a> >
            <span>Cultura Francesa</span>
        </div>

        <!-- Título de la cultura -->
        <div class="culture-header">
            <h1>Cultura Francesa</h1>
            <div class="culture-description">
                <p>Descubre los sabores auténticos de la cocina tradicional francesa</p>
            </div>
        </div>

        <!-- Filtros -->
        <div class="filters">
            <div class="filter-group">
                <button class="filter-button active" onclick="window.location.href='../Platos.html'">Mejor
                    Valoradas</button>
            </div>
            <div class="filter-group">
                <button class="filter-button" id="filter-btn">Filtros</button>
            </div>
        </div>

        <!-- Cuadro emergente de filtros -->
        <div id="filter-options" style="display: none;">
            <label for="filter-culture">Cultura:</label>
            <select id="filter-culture">
                <option value="">Todas</option>
                <option value="Francesa">Francesa</option>
                <option value="Española">Española</option>
                <option value="Italiana">Italiana</option>
                <option value="China">China</option>
                <option value="Japonesa">Japonesa</option>
                <option value="Venezolana">Venezolana</option>
            </select>

            <label for="filter-difficulty">Dificultad:</label>
            <select id="filter-difficulty">
                <option value="">Todas</option>
                <option value="Fácil">Fácil</option>
                <option value="Media">Media</option>
                <option value="Difícil">Difícil</option>
            </select>

            <label for="filter-time">Tiempo:</label>
            <select id="filter-time">
                <option value="">Cualquier tiempo</option>
                <option value="0-30">Menos de 30 min</option>
                <option value="30-60">30 - 60 min</option>
                <option value="60-120">60 - 120 min</option>
                <option value="121">Más de 120 min</option>
            </select>

            <button id="apply-filters">Aplicar Filtros</button>
        </div>

        <!-- Grid de recetas -->
        <div class="recipes-grid">
            <div class="recipe-card" data-culture="Francesa" data-time="165" data-difficulty="Media">
                <div class="recipe-image">
                    <a href="./../US6_GuardarRecetas/coq-au-vin.html"><img src="../Imagenes/Francia/coq-au-vin.jpg"
                            alt="Coq au vin"></a>
                </div>
                <h3>Coq au vin</h3>
                <div class="recipe-meta">
                    <span class="difficulty">Media</span>
                    <span class="time">2h 45 min</span>
                    <span class="category">Comida</span>
                </div>
            </div>

            <div class="recipe-card" data-culture="Francesa" data-time="30" data-difficulty="Fácil">
                <div class="recipe-image">
                    <a href="./../US6_GuardarRecetas/crepas-dulces.html"><img src="../Imagenes/Francia/crepas-dulces.jpg"
                            alt="Crepas dulces"></a>
                </div>
                <h3>Crepas dulces</h3>
                <div class="recipe-meta">
                    <span class="difficulty">Fácil</span>
                    <span class="time">30 min</span>
                    <span class="category">Merienda</span>
                </div>
            </div>

            <div class="recipe-card" data-culture="Francesa" data-time="60" data-difficulty="Media">
                <div class="recipe-image">
                    <a href="./../US6_GuardarRecetas/quiche-lorraine.html"><img src="../Imagenes/Francia/quiche-lorraine.pn.webp"
                            alt="Quiche Lorraine"></a>
                </div>
                <h3>Quiche Lorraine</h3>
                <div class="recipe-meta">
                    <span class="difficulty">Media</span>
                    <span class="time">1h</span>
                    <span class="category">Comida</span>
                </div>
            </div>

            <div class="recipe-card" data-culture="Francesa" data-time="20" data-difficulty="Fácil">
                <div class="recipe-image">
                    <a href="./../US6_GuardarRecetas/tostada-francesa.html"><img src="../Imagenes/Francia/tostada-francesa.jpg"
                            alt="Tostada Francesa"></a>
                </div>
                <h3>Tostada Francesa</h3>
                <div class="recipe-meta">
                    <span class="difficulty">Fácil</span>
                    <span class="time">20 min</span>
                    <span class="category">Desayuno</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Placeholder para el footer -->
    <div id="footer-placeholder"></div>

    <script src="index.js" defer></script>
    <script src="include-components.js" defer></script>
    <script src="../fix-links.js"></script>
    <script>
        // Script para los filtros
        document.addEventListener("DOMContentLoaded", () => {
            const filterBtn = document.getElementById("filter-btn");
            const filterOptions = document.getElementById("filter-options");
            const applyFiltersBtn = document.getElementById("apply-filters");

            filterBtn.addEventListener("click", () => {
                filterOptions.style.display = filterOptions.style.display === "none" ? "block" : "none";
            });

            applyFiltersBtn.addEventListener("click", () => {
                const selectedCulture = document.getElementById("filter-culture").value;
                const selectedDifficulty = document.getElementById("filter-difficulty").value;
                const selectedTime = document.getElementById("filter-time").value;

                const recipes = document.querySelectorAll(".recipe-card");

                recipes.forEach(recipe => {
                    const recipeCulture = recipe.getAttribute("data-culture");
                    const recipeTime = parseInt(recipe.getAttribute("data-time"));
                    const recipeDifficulty = recipe.getAttribute("data-difficulty");

                    const matchesCulture = !selectedCulture || selectedCulture === recipeCulture;
                    const matchesDifficulty = !selectedDifficulty || selectedDifficulty === recipeDifficulty;
                    let matchesTime = false;

                    if (selectedTime === "" ||
                        (selectedTime === "0-30" && recipeTime <= 30) ||
                        (selectedTime === "30-60" && recipeTime > 30 && recipeTime <= 60) ||
                        (selectedTime === "60-120" && recipeTime > 60 && recipeTime <= 120) ||
                        (selectedTime === "121" && recipeTime > 120)) {
                        matchesTime = true;
                    }

                    if (matchesCulture && matchesDifficulty && matchesTime) {
                        recipe.style.display = "block";
                    } else {
                        recipe.style.display = "none";
                    }
                });

                filterOptions.style.display = "none";
            });

            document.addEventListener("click", (event) => {
                if (!filterOptions.contains(event.target) && event.target !== filterBtn) {
                    filterOptions.style.display = "none";
                }
            });
        });
    </script>
</body>

</html>
